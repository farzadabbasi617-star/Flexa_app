<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اتصال برقرار نیست — گیمنت</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d0b16; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    padding: 24px; text-align: center;
  }
  .box { max-width: 420px; }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
  p { font-size: 14px; color: #9ca3af; line-height: 2; margin-bottom: 24px; }
  button {
    background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; border: 0;
    padding: 14px 44px; border-radius: 16px; font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 8px 24px rgba(124, 58, 237, .35);
  }
  button:active { transform: scale(.97); }
  .hint { margin-top: 18px; font-size: 11px; color: #6b7280; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>اتصال برقرار نشد</h1>
    <p>اینترنت گوشی قطع یا کنده است.<br>وای‌فای یا دیتا (و VPN) را چک کن و دوباره امتحان کن.</p>
    <button onclick="location.reload()">🔄 تلاش مجدد</button>
    <div class="hint">گیمنت — این پیام آفلاین است؛ با برگشت اینترنت صفحه عادی بالا می‌آید.</div>
  </div>
</body>
</html>
